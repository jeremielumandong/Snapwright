[package]
name = "snapwright-capture"
description = "Screen capture backends for Snapwright: one API, a native backend per OS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
x11rb.workspace = true
libc.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation.workspace = true
objc2-core-foundation.workspace = true
objc2-core-graphics.workspace = true
objc2-screen-capture-kit.workspace = true
block2.workspace = true

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
x11rb.workspace = true
