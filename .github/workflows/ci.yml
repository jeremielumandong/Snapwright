name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    name: clippy + tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux system packages for GPUI and the X11 tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libxcb1-dev libvulkan-dev libfontconfig-dev libfreetype-dev pkg-config \
            xvfb mesa-vulkan-drivers xdotool xclip x11-xserver-utils imagemagick ffmpeg
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: X11 capture tests (Xvfb)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" \
            cargo test -p snapwright-capture --test x11 -- --ignored
      - name: Capture benchmark (Xvfb)
        if: runner.os == 'Linux'
        run: |
          cargo build --release -p snapwright-cli -p snapwright-app
          xvfb-run -a -s "-screen 0 2560x1440x24" target/release/snapwright bench --runs 100
      - name: Overlay end to end (Xvfb, software Vulkan)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1600x1000x24" scripts/overlay-e2e.sh target/release
      - name: Hotkey latency (Xvfb, software Vulkan)
        if: runner.os == 'Linux'
        env:
          E2E_OUT: ${{ runner.temp }}/latency
        run: |
          mkdir -p "$E2E_OUT"
          xvfb-run -a -s "-screen 0 1920x1080x24" scripts/latency-bench.sh target/release
      - name: Upload latency results
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v4
        with:
          name: latency
          path: ${{ runner.temp }}/latency/*.json
          if-no-files-found: ignore
      # Hosted macOS runners have no Screen Recording permission and Windows runners only a
      # basic display adapter, so these record what happens without failing the build.
      - name: Capture smoke test (informational)
        if: runner.os != 'Linux'
        continue-on-error: true
        run: |
          cargo build --release -p snapwright-cli
          target/release/snapwright displays
          target/release/snapwright windows
          target/release/snapwright bench --runs 20
